
name: Build Ethiopia cities and towns dataset

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Run R extraction
        run: Rscript fetch_cities.R

      - name: Upload dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethiopia-cities-towns-data
          path: data/
          if-no-files-found: warn
